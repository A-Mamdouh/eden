name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      # LunarG's own documented apt-repo method for CI/automation use,
      # https://vulkan.lunarg.com/doc/sdk/latest/linux/getting_started.html --
      # only the loader/headers/glslc are needed to build and link (no GPU
      # or ICD required, since nothing in the test suite calls into real
      # Vulkan; it exercises NullRenderer instead).
      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Configure Eden through a separate parent project. Reuse the dependency
      # sources downloaded above so this verifies subproject defaults and the
      # public link interface without cloning everything a second time.
      - name: Configure consumer smoke test
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_SPDLOG="$GITHUB_WORKSPACE/build/_deps/spdlog-src" \
            -DFETCHCONTENT_SOURCE_DIR_SDL2="$GITHUB_WORKSPACE/build/_deps/sdl2-src" \
            -DFETCHCONTENT_SOURCE_DIR_ENTT="$GITHUB_WORKSPACE/build/_deps/entt-src" \
            -DFETCHCONTENT_SOURCE_DIR_GLM="$GITHUB_WORKSPACE/build/_deps/glm-src"

      - name: Build consumer smoke test
        run: cmake --build build-consumer --target EdenConsumerSmoke

      - name: Run consumer smoke test
        run: ./build-consumer/EdenConsumerSmoke
