name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # LunarG's own documented apt-repo method for CI/automation use,
      # https://vulkan.lunarg.com/doc/sdk/latest/linux/getting_started.html --
      # only the loader/headers/glslc are needed to build and link (no GPU
      # or ICD required, since nothing in the test suite calls into real
      # Vulkan; it exercises NullRenderer instead).
      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
